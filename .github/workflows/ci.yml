---
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  # Detect which packages are affected by the changes
  detect:
    name: Detect Affected
    runs-on: ubuntu-latest
    outputs:
      affected: ${{ steps.affected.outputs.packages }}
      test-matrix: ${{ steps.affected.outputs.test_matrix }}
      typecheck-matrix: ${{ steps.affected.outputs.typecheck_matrix }}
      needs-engine: ${{ steps.affected.outputs.needs_engine }}
      has-tests: ${{ steps.affected.outputs.has_tests }}
      has-typechecks: ${{ steps.affected.outputs.has_typechecks }}
      run-all: ${{ steps.affected.outputs.run_all }}
      # Scope flags. A job that can only fail for one kind of change waits for
      # that kind of change instead of running on every PR (#1783).
      engine: ${{ steps.affected.outputs.engine }}
      ui: ${{ steps.affected.outputs.ui }}
      tooling: ${{ steps.affected.outputs.tooling }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Detect affected packages
        id: affected
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="HEAD~1"
          fi

          RESULT=$(node .github/scripts/affected-packages.mjs "$BASE")
          echo "Full result: $RESULT"

          PACKAGES=$(echo "$RESULT" | jq -c '.affectedPackages')
          TEST_MATRIX=$(echo "$RESULT" | jq -c '.testMatrix')
          TC_MATRIX=$(echo "$RESULT" | jq -c '.typecheckMatrix')
          NEEDS_ENGINE=$(echo "$RESULT" | jq -r '.needsEngine')
          RUN_ALL=$(echo "$RESULT" | jq -r '.runAll')
          ENGINE=$(echo "$RESULT" | jq -r '.scope.engine')
          UI=$(echo "$RESULT" | jq -r '.scope.ui')
          TOOLING=$(echo "$RESULT" | jq -r '.scope.tooling')
          HAS_TESTS=$(echo "$RESULT" | \
            jq -r '.testMatrix | length > 0')
          HAS_TC=$(echo "$RESULT" | \
            jq -r '.typecheckMatrix | length > 0')

          echo "packages=$PACKAGES" >> $GITHUB_OUTPUT
          echo "test_matrix=$TEST_MATRIX" >> $GITHUB_OUTPUT
          echo "typecheck_matrix=$TC_MATRIX" >> $GITHUB_OUTPUT
          echo "needs_engine=$NEEDS_ENGINE" >> $GITHUB_OUTPUT
          echo "has_tests=$HAS_TESTS" >> $GITHUB_OUTPUT
          echo "has_typechecks=$HAS_TC" >> $GITHUB_OUTPUT
          echo "run_all=$RUN_ALL" >> $GITHUB_OUTPUT
          echo "engine=$ENGINE" >> $GITHUB_OUTPUT
          echo "ui=$UI" >> $GITHUB_OUTPUT
          echo "tooling=$TOOLING" >> $GITHUB_OUTPUT

          # Summary for the Actions UI
          echo "### Affected Packages" >> $GITHUB_STEP_SUMMARY
          echo "$RESULT" | jq -r '.affectedPackages[]' | \
            while read pkg; do
            echo "- \`$pkg\`" >> $GITHUB_STEP_SUMMARY
          done
          CHANGED=$(echo "$RESULT" | jq -r '.changedFiles')
          AFFECTED=$(echo "$RESULT" | \
            jq -r '.affectedPackages | length')
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**$CHANGED files changed → $AFFECTED affected**" \
            >> $GITHUB_STEP_SUMMARY
          echo "Scope: engine=$ENGINE ui=$UI tooling=$TOOLING" \
            >> $GITHUB_STEP_SUMMARY

  # Run tests only for affected packages
  test:
    name: "Test: ${{ matrix.name }}"
    needs: detect
    if: needs.detect.outputs.has-tests == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.detect.outputs.test-matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup workspace
        uses: ./.github/actions/grove-setup
        with:
          build-engine: ${{ needs.detect.outputs.needs-engine }}

      - name: Sync SvelteKit
        if: matrix.isSvelteKit
        run: pnpm exec svelte-kit sync
        working-directory: ${{ matrix.package }}

      # Aspen's `routes` test project boots the built SvelteKit worker, and that
      # build imports `@autumnsgrove/gossamer/svelte` through the engine's dist.
      # The shared setup builds the engine but not gossamer, so it is built here
      # for Aspen only.
      - name: Build gossamer for Aspen's test build
        if: matrix.package == 'apps/aspen'
        run: pnpm run build
        working-directory: libs/gossamer

      - name: Run tests
        run: pnpm test:run
        working-directory: ${{ matrix.package }}

  # Type check only affected packages
  typecheck:
    name: "Check: ${{ matrix.name }}"
    needs: detect
    if: needs.detect.outputs.has-typechecks == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.detect.outputs.typecheck-matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup workspace
        uses: ./.github/actions/grove-setup
        with:
          build-engine: ${{ needs.detect.outputs.needs-engine }}
          build-foliage: ${{ needs.detect.outputs.needs-engine }}
          build-gossamer: ${{ needs.detect.outputs.needs-engine }}

      - name: Sync SvelteKit
        if: matrix.isSvelteKit
        run: pnpm exec svelte-kit sync
        working-directory: ${{ matrix.package }}

      - name: Type check
        run: ${{ matrix.command }}
        working-directory: ${{ matrix.package }}

  # Barrel export verification. Only meaningful when the engine's surface
  # moved, so it waits for an engine change instead of running on every PR.
  barrel-exports:
    name: Engine Barrel Exports
    needs: detect
    if: needs.detect.outputs.engine == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Verify engine barrel exports
        run: ./tools/verify-engine-exports.sh

  # Accent color enforcement. Only markup, styles or tokens can introduce a
  # hardcoded colour — a TypeScript-only PR cannot.
  accent-colors:
    name: Accent Color Tokens
    needs: detect
    if: needs.detect.outputs.ui == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check for hardcoded accent colors
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            ./tools/check-accent-colors.sh --pr "${{ github.event.pull_request.base.sha }}"
          else
            ./tools/check-accent-colors.sh
          fi

  # The label manifest is load-bearing: tools/labels/sync.ts, the labeler
  # workflow and the issue templates all read it. A malformed entry fails here
  # rather than silently becoming a label nobody can explain. The pure logic
  # behind link-pr-to-issue.yml is tested here too, as is the README inventory
  # and the affected-package detector itself — all repo machinery, all gated on
  # a change to repo machinery (or to the package structure, which the inventory
  # and the label vocabulary both depend on).
  labels:
    name: Repo Tooling
    needs: detect
    if: needs.detect.outputs.tooling == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup workspace
        uses: ./.github/actions/grove-setup
        with:
          build-engine: "false"

      - name: Validate .github/labels.yml
        run: pnpm labels:check

      - name: Test the PR link parser
        run: node --test .github/scripts/issue-refs.test.mjs

      # CI and the deploy workflows drifted two Node majors apart for months and
      # nothing said so, until it showed up as failing tests (#1758).
      - name: Check the Node version agrees everywhere
        run: node --test .github/scripts/node-version.test.mjs

      # Which changes are allowed to cascade, and which are not, is now the
      # whole cost model of CI (#1783). It gets tests like any other logic.
      - name: Test the affected-package detector
        run: node --test .github/scripts/affected-packages.test.mjs

      # README had meadow, terrarium and ivy in its tables for a year after they
      # were gone, and Aspen missing entirely (#1705). Cheaper to check than to
      # rediscover.
      - name: Check README inventory
        run: pnpm readme:check

      - name: Test repo scripts
        run: pnpm test:scripts

  # Lint (always runs — it is the one whole-repo check that any file can break)
  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup workspace
        uses: ./.github/actions/grove-setup

      - name: Run linters
        id: lint
        run: |
          pnpm lint 2>&1 | tee /tmp/lint-output.txt
        continue-on-error: true

      - name: Comment on PR with lint errors
        if: >-
          steps.lint.outcome == 'failure' &&
          github.event_name == 'pull_request'
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const raw = fs.readFileSync('/tmp/lint-output.txt', 'utf8');

            // Extract only the error/warning lines (skip noise)
            const lines = raw.split('\n');
            const errorLines = lines.filter(l =>
              /\d+:\d+\s+(error|warning)/.test(l) ||
              /^\s+✖/.test(l) ||
              /^\/home/.test(l) ||
              /Found \d+ warnings/.test(l)
            );

            // Build a focused summary
            let body = '## 🔴 Lint Failed\n\n';
            body += 'The lint check found errors that must be ';
            body += 'fixed before merging.\n\n';
            body += '```\n' + errorLines.join('\n') + '\n```\n\n';
            body += '**Full output** is in the [Lint job logs]';
            const runUrl = process.env.GITHUB_SERVER_URL + '/' +
              process.env.GITHUB_REPOSITORY + '/actions/runs/' +
              process.env.GITHUB_RUN_ID;
            body += `(${runUrl}).\n`;

            // Find and update existing comment, or create new one
            const { data: comments } =
              await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
              });

            const existing = comments.find(c =>
              c.user.type === 'Bot' &&
              c.body.includes('Lint Failed')
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Fail if lint errored
        if: steps.lint.outcome == 'failure'
        run: exit 1

      # TODO: Enable after running `pnpm format` on full codebase
      # - name: Check formatting
      #   run: pnpm format:check

  # Summary gate - blocks merge if any job fails
  ci-pass:
    name: CI Pass
    if: always()
    needs: [detect, test, typecheck, barrel-exports, accent-colors, labels, lint]
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Check all jobs
        id: check
        run: |
          FAILED=""
          for job in detect test typecheck barrel-exports accent-colors labels lint; do
            case "$job" in
              detect)        RESULT="${{ needs.detect.result }}" ;;
              test)          RESULT="${{ needs.test.result }}" ;;
              typecheck)     RESULT="${{ needs.typecheck.result }}" ;;
              barrel-exports) RESULT="${{ needs.barrel-exports.result }}" ;;
              accent-colors) RESULT="${{ needs.accent-colors.result }}" ;;
              labels)        RESULT="${{ needs.labels.result }}" ;;
              lint)          RESULT="${{ needs.lint.result }}" ;;
            esac
            echo "$job: $RESULT"
            if [ "$RESULT" = "failure" ]; then
              FAILED="$FAILED $job"
            fi
          done

          if [ -n "$FAILED" ]; then
            echo "failed_jobs=$FAILED" >> $GITHUB_OUTPUT
            echo "::error::Failed jobs:$FAILED"
            exit 1
          fi

          echo "All CI checks passed"

      - name: Comment on PR with failure summary
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v8
        with:
          script: |
            const failed = '${{ steps.check.outputs.failed_jobs }}'
              .trim().split(/\s+/);
            const runUrl = process.env.GITHUB_SERVER_URL + '/' +
              process.env.GITHUB_REPOSITORY + '/actions/runs/' +
              process.env.GITHUB_RUN_ID;

            let body = '## 🔴 CI Failed\n\n';
            body += '| Job | Status |\n|-----|--------|\n';

            const jobs = [
              'detect', 'test', 'typecheck', 'barrel-exports', 'accent-colors', 'lint'
            ];
            const results = {
              detect: '${{ needs.detect.result }}',
              test: '${{ needs.test.result }}',
              typecheck: '${{ needs.typecheck.result }}',
              'barrel-exports': '${{ needs.barrel-exports.result }}',
              'accent-colors': '${{ needs.accent-colors.result }}',
              lint: '${{ needs.lint.result }}',
            };

            for (const job of jobs) {
              const r = results[job];
              const icon = r === 'success' ? '✅' :
                r === 'failure' ? '❌' :
                r === 'skipped' ? '⏭️' : '⚪';
              body += `| ${job} | ${icon} ${r} |\n`;
            }

            body += `\n[View full run](${runUrl})\n`;

            const { data: comments } =
              await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
              });

            const existing = comments.find(c =>
              c.user.type === 'Bot' &&
              c.body.includes('CI Failed')
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
