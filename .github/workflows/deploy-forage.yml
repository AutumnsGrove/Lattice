---
name: Deploy Forage

on:
  push:
    branches: [main]
    paths:
      - "services/forage/**"
      - "libs/loom/**"
      # Builds the engine library (needs-engine), so an engine change is a
      # change to this bundle. See #1733: durable-objects stopped deploying for
      # two hours because its list named directories rather than the dependency.
      - "libs/engine/**"
  workflow_dispatch:

permissions:
  contents: read
  deployments: write
  issues: write

jobs:
  deploy:
    uses: ./.github/workflows/_deploy-worker.yml
    with:
      worker-dir: services/forage
      needs-engine: true
    secrets: inherit
