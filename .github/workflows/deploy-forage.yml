---
name: Deploy Forage

on:
  push:
    branches: [main]
    paths:
      - "services/forage/**"
      - "libs/loom/**"
  workflow_dispatch:

permissions:
  contents: read
  deployments: write
  issues: write

jobs:
  deploy:
    uses: ./.github/workflows/_deploy-worker.yml
    with:
      worker-dir: services/forage
      needs-engine: true
    secrets: inherit
