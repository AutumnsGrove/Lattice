---
name: Auto-Label Issues

# One model call, one vocabulary file, no regex.
#
# The vocabulary is .github/labels.yml. This workflow never names a label of
# its own: add one there (group: type / component / pattern) and it becomes
# available here with no change to this file. Change a `when` rule and the
# labeler's judgement changes with it.
#
# Why this exists: the previous version had 34 regex rule blocks, matched body
# text as well as titles, and labelled whatever it could find. It put
# `pattern:threshold` on a NCMEC decision (#1625), `pattern:sentinel` on an
# E2E test suite (#1479), and `ivy` on a Porch issue (#1626) — Ivy is shelved.
# A regex cannot tell that a queue is not a rate limit. This can.
#
# Scope, deliberately narrow:
#   - Fires when Autumn opens an issue, and only Autumn. Anyone else's issue
#     keeps whatever a human gave it; the manual button is the way in.
#   - Additive only. It never removes a label a human applied.
#   - Not on `edited`: a title typo is not a reason to spend a model call, and
#     two runs can disagree with each other. Edit the labels, or press run.

"on":
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Issue number to label
        required: true

concurrency:
  group: auto-label-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

jobs:
  label:
    # The author gate. An issue body is untrusted input and this job can write
    # labels; giving every stranger who opens an issue a shot at the prompt is
    # not a trade worth making. Autumn's own issues are the 99% case.
    #
    # Claude files issues as her, so they are covered. Anyone else: Actions →
    # Auto-Label Issues → Run workflow → issue number.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.issue.user.login == 'AutumnsGrove' &&
      github.event.issue.pull_request == null)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          persist-credentials: false

      # The model may only choose from labels it was shown, and the guard
      # checks against the same generated list. One source, two uses, no drift.
      - name: Build the vocabulary
        id: vocab
        run: |
          set -euo pipefail
          # name → group, so the guard can enforce one label per group.
          awk '
            /^  - name:/ { name = $3 }
            /^    group:/ { print name "\t" $2 }
          ' .github/labels.yml > "$RUNNER_TEMP/labels.tsv"

          # The only labels a machine may assign.
          awk -F'\t' '$2 ~ /^(type|component|pattern)$/ { print $1 }' \
            "$RUNNER_TEMP/labels.tsv" | sort -u > "$RUNNER_TEMP/allowed.txt"

          count=$(wc -l < "$RUNNER_TEMP/allowed.txt" | tr -d ' ')
          echo "count=$count" >> "$GITHUB_OUTPUT"

          # Fail loudly rather than quietly labelling nothing forever. This
          # awk knows the manifest's shape; if the shape moves, fix it here.
          if [ "$count" -lt 10 ]; then
            echo "::error file=.github/labels.yml::Parsed only $count automation labels."
            echo "::error::The manifest layout changed — update the awk in this workflow."
            exit 1
          fi
          echo "Vocabulary: $count labels"

      - name: Install pi
        run: npm install --global @earendil-works/pi-coding-agent

      # OpenCode Go (not Zen — Go is the subscription for open coding models;
      # Zen is the pay-per-request catalog). The models below all live on Go's
      # OpenAI-compatible chat-completions endpoint, so pi reaches them through
      # models.json rather than a login step. Pi is on Go's validated-client
      # list and sends the x-opencode-session header Go asks for, which is why
      # this works without a custom-header wrapper.
      #
      # The key is interpolated from the environment at request time; it is
      # never written to disk.
      #
      # Only models whose Go endpoint is chat/completions can live in this
      # provider entry. Go also serves some models on /responses and /messages
      # (MiniMax, Qwen) — those need their own provider entry, not a new id here.
      # glm-5.3-flash is the default because labelling costs about $0.0002 an
      # issue and it retains nothing for zero days.
      - name: Point pi at OpenCode Go
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.pi/agent"
          cat > "$HOME/.pi/agent/models.json" <<'JSON'
          {
            "$schema": "https://pi.dev/schemas/models.schema.json",
            "providers": {
              "opencode-go": {
                "baseUrl": "https://opencode.ai/zen/go/v1",
                "api": "openai-completions",
                "apiKey": "${OPENCODE_GO_API_KEY}",
                "models": [
                  { "id": "glm-5.3-flash" },
                  { "id": "glm-5.3" },
                  { "id": "kimi-k3" },
                  { "id": "deepseek-v4-pro" }
                ]
              }
            }
          }
          JSON

      - name: Ask pi for labels
        id: ask
        env:
          OPENCODE_GO_API_KEY: ${{ secrets.OPENCODE_GO_API_KEY }}
          LABEL_MODEL: ${{ vars.LABEL_MODEL || 'glm-5.3-flash' }}
          ISSUE_TITLE: ${{ github.event.issue.title || '' }}
          ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number }}
        run: |
          set -euo pipefail

          this_number="$ISSUE_NUMBER"
          if [ -z "${this_number:-}" ]; then
            echo "::error::No issue number. Pass one to the manual trigger."
            exit 1
          fi

          # Re-fetch through the API so manual runs and opened runs take the
          # same path, and so the body is the one stored, not a payload echo.
          gh issue view "$this_number" --json title,body \
            > "$RUNNER_TEMP/issue.json"

          {
            echo "# Issue under review"
            jq -r '"Title: " + .title + "\n\n" + (.body // "(no body)")' "$RUNNER_TEMP/issue.json"
          } > "$RUNNER_TEMP/issue.md"

          pi \
            --print \
            --no-session \
            --no-tools \
            --no-approve \
            --no-context-files \
            --no-extensions \
            --no-skills \
            --no-mcp \
            --provider opencode-go \
            --model "$LABEL_MODEL" \
            --thinking low \
            "You label GitHub issues for the Grove codebase.

          ## Vocabulary
          @.github/labels.yml

          Each label carries a \`when\` line. That line is the rule. The label's
          name is not evidence of anything.

          ## Your job
          Read the issue in the prompt and choose the labels that apply.

          Reply with JSON and nothing else — no prose, no code fence:
          {\"labels\": [\"...\"], \"why\": \"one sentence\"}

          ## Rules, in order of importance
          1. Only labels whose \`group\` is type, component, or pattern. Never
             size, priority, readiness, or machine — those are human calls.
          2. At most one type, one component, one pattern. Fewer is fine.
          3. A component label requires the product to be named in the title, or
             the issue to be plainly about that product's own code. A word
             appearing in the body is not enough — that is how a Porch issue got
             labelled Ivy.
          4. If nothing clearly applies, return an empty list. An unlabelled
             issue is better than a wrong label, and it is always an acceptable
             answer.
          " < "$RUNNER_TEMP/issue.md" > "$RUNNER_TEMP/reply.txt" 2>"$RUNNER_TEMP/pi.err" \
            || { echo "::error::pi failed to run — see the log."
                 cat "$RUNNER_TEMP/pi.err"
                 exit 1; }

          # Models like to wrap JSON in a fence even when told not to.
          sed -e '/^```/d' "$RUNNER_TEMP/reply.txt" \
            | jq -c 'if type == "object" then . else error("not an object") end' \
            > "$RUNNER_TEMP/reply.json" 2>/dev/null \
            || { echo "::error::pi did not return usable JSON:"
                 cat "$RUNNER_TEMP/reply.txt"
                 exit 1; }

      # The model proposes; this decides. A prompt injection in an issue body
      # can at most propose a name that is not in the vocabulary, and that name
      # is dropped here.
      - name: Apply the labels it can justify
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number }}
        run: |
          set -euo pipefail

          proposed=$(jq -r '.labels[]? // empty' "$RUNNER_TEMP/reply.json")
          why=$(jq -r '.why // ""' "$RUNNER_TEMP/reply.json")

          # Groups already spoken for by an existing label — this is what stops
          # a manual re-run stacking a second `type` on a deliberate one.
          gh issue view "$ISSUE_NUMBER" --json labels \
            | jq -r '.labels[].name' > "$RUNNER_TEMP/existing.txt"
          used_groups=""
          while read -r existing; do
            [ -z "$existing" ] && continue
            group=$(awk -F'\t' -v n="$existing" '$1 == n { print $2 }' "$RUNNER_TEMP/labels.tsv")
            [ -n "$group" ] && used_groups="$used_groups $group"
          done < "$RUNNER_TEMP/existing.txt"

          kept=""
          dropped=""
          taken=""
          for label in $proposed; do
            if ! grep -Fxq -- "$label" "$RUNNER_TEMP/allowed.txt"; then
              dropped="$dropped $label"
              continue
            fi
            group=$(awk -F'\t' -v n="$label" '$1 == n { print $2 }' "$RUNNER_TEMP/labels.tsv")
            case " $used_groups " in
              *" $group "*)
                taken="$taken $label"
                continue
                ;;
            esac
            kept="${kept:+$kept,}$label"
            used_groups="$used_groups $group"
          done

          {
            echo "## Issue #$ISSUE_NUMBER"
            echo ""
            echo "**Reasoning:** ${why:-(none given)}"
            echo ""
            if [ -n "$kept" ]; then
              echo "**Applied:** \`$kept\`"
            else
              echo "**Applied:** nothing"
            fi
            if [ -n "$taken" ]; then
              echo ""
              echo "**Skipped (that group already has a label):** \`${taken# }\`"
            fi
            if [ -n "$dropped" ]; then
              echo ""
              echo "**Dropped (not in the manifest):** \`${dropped# }\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -z "$kept" ]; then
            echo "::notice::No labels applied — the model found nothing it could justify."
            exit 0
          fi

          gh issue edit "$ISSUE_NUMBER" --add-label "$kept"
          echo "Applied: $kept"
