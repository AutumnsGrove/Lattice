---
name: Build & Migrate Engine

# Engine is a library — it no longer deploys a frontend.
# Aspen (apps/aspen) handles the tenant app deploy via deploy-aspen.yml.
# This workflow builds, tests, type-checks, and runs D1 migrations.

on:
  push:
    branches: [main]
    paths:
      - "libs/engine/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "docs/philosophy/grove-naming.md"
      - "scripts/generate/grove-term-manifest.ts"
  workflow_dispatch:

permissions:
  contents: read
  deployments: write
  issues: write

jobs:
  build-and-migrate:
    uses: ./.github/workflows/_deploy-worker.yml
    with:
      worker-dir: libs/engine
      needs-engine: true
      needs-foliage: true
      run-tests: true
      typecheck-command: pnpm check
      run-migrations: true
      migration-db: grove-engine-db
      run-deploy: false
    secrets: inherit
