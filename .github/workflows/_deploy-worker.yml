---
# Reusable workflow for deploying Cloudflare Workers.
#
# Each worker/service calls this with its own parameters.
# The calling workflow still appears as its own entry in the
# Actions tab with full step-level logs.
#
# NOTE: Reusable workflows cannot use local composite actions (like
# grove-setup) because GitHub pre-validates action references before
# checkout. Setup steps are inlined here instead.
#
# Usage (thin shim):
#   jobs:
#     deploy:
#       uses: ./.github/workflows/_deploy-worker.yml
#       with:
#         worker-dir: services/heartwood
#       secrets: inherit

name: _Deploy Worker

on:
  workflow_call:
    inputs:
      worker-dir:
        description: >
          Worker directory relative to repo root
          (e.g. services/heartwood)
        required: true
        type: string
      needs-engine:
        description: "Build libs/engine before deploying"
        required: false
        type: boolean
        default: false
      needs-foliage:
        description: "Build libs/foliage before engine"
        required: false
        type: boolean
        default: false
      run-deploy:
        description: >
          Run `wrangler deploy` at the end. Set false for library-only
          workflows that only need migrations (e.g. libs/engine).
        required: false
        type: boolean
        default: true
      run-typecheck:
        description: "Run type checking"
        required: false
        type: boolean
        default: true
      typecheck-command:
        description: >
          Type check command (default: pnpm exec tsc --noEmit)
        required: false
        type: string
        default: "pnpm exec tsc --noEmit"
      run-tests:
        description: "Run tests before deploying"
        required: false
        type: boolean
        default: false
      test-command:
        description: "Test command to run"
        required: false
        type: string
        default: "pnpm test:run"
      run-build:
        description: >
          Run pnpm run build before deploying
          (for SvelteKit workers like Clearing)
        required: false
        type: boolean
        default: false
      run-migrations:
        description: "Run D1 database migrations before deploying"
        required: false
        type: boolean
        default: false
      migration-db:
        description: "D1 database name for migrations"
        required: false
        type: string
        default: ""
      checkout-ref:
        description: Git ref to checkout (default triggering ref)
        required: false
        type: string
        default: ""
      pre-deploy-command:
        description: >
          Command to run after migrations but before deploy
          (e.g. KB sync)
        required: false
        type: string
        default: ""
      deploy-env:
        description: >
          Wrangler environment name to deploy (e.g. "beta"), passed as
          `--env <value>`. Empty deploys the default (production) environment.
        required: false
        type: string
        default: ""
      service-name-override:
        description: >
          Override the service name used in failure-tracking issue titles
          (default: worker-dir basename). Needed when multiple environments
          of the same worker-dir (e.g. prod + beta) would otherwise collide
          on the same tracking issue.
        required: false
        type: string
        default: ""

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
      # post-deploy steps open/close rolling failure issues
      issues: write

    steps:
      # Inline grove-setup (can't use composite action in reusable workflow)
      - name: Checkout
        if: inputs.checkout-ref == ''
        uses: actions/checkout@v5

      - name: Checkout (specific ref)
        if: inputs.checkout-ref != ''
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.checkout-ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: "**/pnpm-lock.yaml"

      - name: Install dependencies
        run: pnpm install

      - name: Build foliage
        if: inputs.needs-foliage
        run: pnpm run build
        working-directory: libs/foliage

      - name: Build gossamer
        if: inputs.needs-engine
        run: pnpm run build
        working-directory: libs/gossamer

      - name: Build engine
        if: inputs.needs-engine
        run: pnpm run package
        working-directory: libs/engine

      # Worker build & deploy
      - name: SvelteKit sync
        if: inputs.run-build
        run: pnpm exec svelte-kit sync
        working-directory: ${{ inputs.worker-dir }}

      - name: Type check
        if: inputs.run-typecheck
        run: ${{ inputs.typecheck-command }}
        working-directory: ${{ inputs.worker-dir }}

      - name: Run tests
        if: inputs.run-tests
        run: ${{ inputs.test-command }}
        working-directory: ${{ inputs.worker-dir }}

      - name: Build
        if: inputs.run-build
        run: pnpm run build
        working-directory: ${{ inputs.worker-dir }}

      - name: Run database migrations
        if: inputs.run-migrations
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >
            d1 migrations apply ${{ inputs.migration-db }} --remote
          workingDirectory: ${{ inputs.worker-dir }}
          packageManager: pnpm

      - name: Run pre-deploy command
        if: inputs.pre-deploy-command != ''
        run: ${{ inputs.pre-deploy-command }}
        working-directory: ${{ inputs.worker-dir }}
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Deploy to Cloudflare Workers
        if: inputs.run-deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            ${{ inputs.deploy-env != '' && format('deploy --env {0}', inputs.deploy-env)
            || 'deploy' }}
          workingDirectory: ${{ inputs.worker-dir }}
          packageManager: pnpm

      # Rolling failure issue: open/comment on fail, close on recovery
      # Runs only on push-to-main. Maintains one GitHub Issue per service
      # with label `deploy-failed` + title `Deploy failing: <service>`.
      # New failure → reopen (if closed) + append comment. Next green run
      # → auto-close with recovery note.
      - name: Open or update failure issue
        if: failure() && github.event_name == 'push'
        uses: actions/github-script@v8
        with:
          script: |
            const workerDir = '${{ inputs.worker-dir }}';
            const serviceOverride = '${{ inputs.service-name-override }}';
            const service = serviceOverride || workerDir.split('/').pop();
            const title = `Deploy failing: ${service}`;
            const { owner, repo } = context.repo;
            const serverUrl = process.env.GITHUB_SERVER_URL;
            const runUrl = `${serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const sha = context.sha.slice(0, 7);
            const commitMsg = context.payload.head_commit?.message || '';
            const msg = commitMsg.split('\n')[0] || '(no message)';

            // Commit message and actor login are wrapped in code
            // spans/quotes so odd markdown (backticks, HTML) doesn't
            // disrupt issue rendering.
            const body = [
              `❌ Deploy to \`${service}\` failed at commit \`${sha}\`.`,
              '',
              `- **Run:** [${context.runId}](${runUrl})`,
              '- **Commit:** `' + sha + '` — `' + msg.replace(/`/g, "'") + '`',
              `- **Triggered by:** \`${context.actor}\``,
              '',
              '_This issue was auto-opened by `_deploy-worker.yml`. ' +
              'It will close automatically on the next successful deploy._',
            ].join('\n');

            // Paginate so we find matching issues even if the
            // deploy-failed label accumulates >100 historical entries
            // across services.
            const existing = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'all', labels: 'deploy-failed', per_page: 100,
            });
            const match = existing.find((i) => i.title === title);

            if (match) {
              if (match.state === 'closed') {
                await github.rest.issues.update({
                  owner, repo, issue_number: match.number, state: 'open'
                });
              }
              await github.rest.issues.createComment({
                owner, repo, issue_number: match.number, body
              });
            } else {
              await github.rest.issues.create({
                owner, repo, title, body,
                labels: ['deploy-failed'],
              });
            }

      - name: Close failure issue on recovery
        if: success() && inputs.run-deploy && github.event_name == 'push'
        uses: actions/github-script@v8
        with:
          script: |
            const workerDir = '${{ inputs.worker-dir }}';
            const serviceOverride = '${{ inputs.service-name-override }}';
            const service = serviceOverride || workerDir.split('/').pop();
            const title = `Deploy failing: ${service}`;
            const { owner, repo } = context.repo;
            const serverUrl = process.env.GITHUB_SERVER_URL;
            const runUrl = `${serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;

            const existing = await github.paginate(
              github.rest.issues.listForRepo, {
              owner, repo, state: 'open', labels: 'deploy-failed',
              per_page: 100,
            });
            const match = existing.find((i) => i.title === title);
            if (!match) return;

            await github.rest.issues.createComment({
              owner, repo, issue_number: match.number,
              body: `✅ Deploy to \`${service}\` recovered. [Run ${context.runId}](${runUrl}).`,
            });
            await github.rest.issues.update({
              owner, repo, issue_number: match.number, state: 'closed',
            });
