---
name: Deploy Timeline Sync

on:
  push:
    branches: [main]
    paths:
      - "workers/timeline-sync/**"
      # Every workspace package the worker's bundle contains. Without these
      # triggers a fix to one of them quietly never reaches this worker — see
      # deploy-aspen.yml for the same gap found there. (This is how the Lumen
      # service-binding fix almost shipped without ever redeploying the worker
      # that needed it.)
      #
      # libs/curios is the timeline itself since #1798 — the day fetcher, the
      # recipe, the record — so a fix there is a fix to this worker. Found when
      # a PR touching only libs/curios reported "no deploy shims affected" and
      # would have merged without deploying.
      - "libs/engine/**"
      - "libs/infra/**"
      - "libs/curios/**"
      - "libs/lyra/**"
      - "libs/grove-crypto/**"
  workflow_dispatch:

permissions:
  contents: read
  deployments: write
  issues: write

jobs:
  deploy:
    uses: ./.github/workflows/_deploy-worker.yml
    with:
      worker-dir: workers/timeline-sync
      needs-engine: true
      run-tests: true
    secrets: inherit
