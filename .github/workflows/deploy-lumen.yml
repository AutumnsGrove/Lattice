---
name: Deploy Lumen

on:
  push:
    branches: [main]
    paths:
      - "workers/lumen/**"
      # The router, task registry and providers live here. This pointed at
      # libs/engine/src/lib/lumen/ for months after the move to ai/, so the
      # Lumen router fix in #1704 deployed only via manual workflow_dispatch.
      - "libs/engine/src/lib/ai/lumen/**"
      # The model registry the router reads. It used to sit beside the router and
      # needed its own path here; it is now its own package (#1602), so both the
      # registry and its pinned catalog are listed — a price fix that never reached
      # the deployed worker was a real bug of this shape.
      - "libs/lumen-registry/**"
  workflow_dispatch:

permissions:
  contents: read
  deployments: write
  issues: write

jobs:
  deploy:
    uses: ./.github/workflows/_deploy-worker.yml
    with:
      worker-dir: workers/lumen
      needs-engine: true
    secrets: inherit
