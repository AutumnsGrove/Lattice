---
name: Validate Deployments

# Catch Wrangler deployment issues BEFORE merging.
# The matrix is generated at runtime from .github/workflows/deploy-*.yml
# shims via scripts/pre-push/deploy-manifest.mjs — adding a new shim
# auto-includes it here, no hand-maintained path list.

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Drift check: every wrangler.toml has a deploy-*.yml shim ─────────
  drift-check:
    name: Deploy Manifest Drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Check for deploy manifest drift
        run: node scripts/pre-push/deploy-manifest.mjs --drift

  # ── Generate matrix from shims, filtered to affected by this PR ─────
  detect:
    name: Detect Affected Deploys
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
      count: ${{ steps.gen.outputs.count }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - id: gen
        name: Generate affected matrix
        # yamllint disable rule:line-length
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          if [ -z "$BASE" ]; then BASE="HEAD~1"; fi
          MATRIX=$(node scripts/pre-push/deploy-manifest.mjs --matrix --affected "$BASE")
          # Default to 0 on any parse failure so the downstream gate
          # `needs.detect.outputs.count != '0'` correctly skips the validate
          # job rather than firing it with an empty matrix (which GitHub
          # Actions treats as a hard error).
          COUNT=$(echo "$MATRIX" | node -e "try{const m=JSON.parse(require('fs').readFileSync(0,'utf8'));console.log(m.include.length)}catch{console.log(0)}" || echo 0)
          if [ -z "$COUNT" ]; then COUNT=0; fi
          echo "matrix=$MATRIX" >> $GITHUB_OUTPUT
          echo "count=$COUNT" >> $GITHUB_OUTPUT
          echo "### Affected Deploys ($COUNT)" >> $GITHUB_STEP_SUMMARY
          if [ "$COUNT" = "0" ]; then
            MSG="_No deploy shims affected by this PR — validation skipped._"
            echo "$MSG" >> $GITHUB_STEP_SUMMARY
          else
            echo "$MATRIX" | node -e "const m=JSON.parse(require('fs').readFileSync(0,'utf8'));m.include.forEach(s=>console.log('- \`'+s.name+'\` ('+s.kind+') — '+s.path))" >> $GITHUB_STEP_SUMMARY
          fi
        # yamllint enable rule:line-length

  # ── Unified validation: Workers (wrangler dry-run) + Pages (build) ──
  validate:
    name: "Validate: ${{ matrix.name }}"
    needs: detect
    if: needs.detect.outputs.count != '0'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: "**/pnpm-lock.yaml"

      - name: Install dependencies
        run: pnpm install

      - name: Build foliage
        if: matrix.needs-foliage
        run: pnpm run build
        working-directory: libs/foliage

      - name: Build gossamer
        if: matrix.needs-engine
        run: pnpm run build
        working-directory: libs/gossamer

      - name: Build engine package
        if: matrix.needs-engine
        run: pnpm run package
        working-directory: libs/engine

      - name: SvelteKit sync
        if: matrix.run-build
        run: pnpm exec svelte-kit sync
        working-directory: ${{ matrix.path }}

      - name: Build (SvelteKit)
        if: matrix.run-build || matrix.kind == 'pages'  # yamllint disable-line rule:line-length
        run: pnpm run build
        working-directory: ${{ matrix.path }}

      - name: Type check
        if: matrix.run-typecheck
        run: ${{ matrix.typecheck-command || 'pnpm exec tsc --noEmit' }}  # yamllint disable-line rule:line-length
        working-directory: ${{ matrix.path }}

      # ── Workers: wrangler deploy --dry-run (skip library-only shims) ──
      # `run-deploy: false` means the real deploy workflow skips `wrangler
      # deploy` entirely (e.g. libs/engine, which only runs D1 migrations
      # and whose wrangler.toml is a Pages config, not a worker config).
      # Validating those with dry-run would fail on config shape alone.
      - name: Validate Worker (wrangler dry-run)
        if: matrix.kind == 'worker' && matrix.run-deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --dry-run
          workingDirectory: ${{ matrix.path }}
          packageManager: pnpm

      # ── Pages: SvelteKit adapter-cloudflare output sanity check ────────
      - name: Validate Pages Worker Output
        if: matrix.kind == 'pages'
        run: |
          WORKER_PATH="${{ matrix.path }}/.svelte-kit/cloudflare/_worker.js"
          if [ -f "$WORKER_PATH" ]; then
            echo "✓ _worker.js exists ($(wc -c < "$WORKER_PATH" | tr -d ' ') bytes)"
            node --check "$WORKER_PATH" 2>/dev/null || echo "⚠ Syntax check skipped (ES modules)"
          else
            echo "✗ _worker.js not found at $WORKER_PATH"
            ls -la "${{ matrix.path }}/.svelte-kit/cloudflare/" || true
            exit 1
          fi

  # ── PR comment with status table + per-failure log excerpts ────────
  post-comment:
    name: Post validation comment
    runs-on: ubuntu-latest
    needs: [drift-check, detect, validate]
    if: always() && github.event_name == 'pull_request'
    permissions:
      pull-requests: write
      actions: read
      contents: read
    steps:
      - name: Post sticky comment
        uses: actions/github-script@v8
        with:
          # yamllint disable rule:line-length
          script: |
            const runId = context.runId;
            const { owner, repo } = context.repo;
            const prNumber = context.payload.pull_request.number;
            const runUrl = `${process.env.GITHUB_SERVER_URL}/${owner}/${repo}/actions/runs/${runId}`;
            const marker = '<!-- deploy-validation-comment -->';

            const driftResult = '${{ needs.drift-check.result }}';
            const detectResult = '${{ needs.detect.result }}';
            const validateResult = '${{ needs.validate.result }}';
            const affectedCount = parseInt('${{ needs.detect.outputs.count }}' || '0', 10);

            // Happy path: nothing affected
            if (affectedCount === 0 && driftResult === 'success') {
              const body = marker + '\n## ✅ Deploy Validation Skipped\n\n' +
                'No deploy shims affected by this PR — no validation needed.\n\n' +
                `[View run](${runUrl})\n`;
              await upsertComment(body);
              return;
            }

            // List all jobs in this workflow run
            const jobsResp = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
              owner, repo, run_id: runId, per_page: 100,
            });
            const validateJobs = jobsResp.filter(j => j.name.startsWith('Validate: '));

            const rows = validateJobs.map(j => ({
              name: j.name.replace(/^Validate:\s*/, ''),
              conclusion: j.conclusion,
              htmlUrl: j.html_url,
              id: j.id,
            }));
            const failed = rows.filter(r => r.conclusion === 'failure');
            const driftFailed = driftResult === 'failure';

            let body = marker + '\n';

            if (failed.length === 0 && !driftFailed) {
              body += '## ✅ Deploy Validation Passed\n\n';
              body += `All ${rows.length} affected deploys validated successfully.\n\n`;
              if (rows.length > 0) {
                body += '| Service | Kind | Status |\n|---------|------|--------|\n';
                for (const r of rows) body += `| \`${r.name}\` | — | ✅ passed |\n`;
                body += '\n';
              }
              body += `[View run](${runUrl})\n`;
              await upsertComment(body);
              return;
            }

            body += '## 🔴 Deploy Validation Failed\n\n';
            if (driftFailed) {
              body += '⚠️ **Deploy manifest drift detected.** A `wrangler.toml` exists without a matching `deploy-*.yml` shim (or vice versa). See the [drift-check job](' + runUrl + ') for details.\n\n';
            }
            if (failed.length > 0) {
              body += `**${failed.length} of ${rows.length}** affected deploys failed validation.\n\n`;
              body += '| Service | Status | Logs |\n|---------|--------|------|\n';
              for (const r of rows) {
                const icon = r.conclusion === 'success' ? '✅'
                  : r.conclusion === 'failure' ? '❌'
                  : r.conclusion === 'skipped' ? '⏭️' : '⚪';
                body += `| \`${r.name}\` | ${icon} ${r.conclusion || 'pending'} | [view](${r.htmlUrl}) |\n`;
              }
              body += '\n### Failure details\n\n';

              for (const fail of failed) {
                body += `<details><summary>❌ <code>${fail.name}</code></summary>\n\n`;
                try {
                  const logResp = await github.rest.actions.downloadJobLogsForWorkflowRun({
                    owner, repo, job_id: fail.id,
                  });
                  const rawLog = typeof logResp.data === 'string'
                    ? logResp.data
                    : Buffer.from(logResp.data).toString('utf8');
                  const lines = rawLog.split('\n').map(l => l.replace(/^\d{4}-\d{2}-\d{2}T[\d:.]+Z\s?/, ''));
                  const errorIdx = lines.findIndex(l => /##\[error\]|^\s*Error:|\bError:\b/.test(l));
                  let excerpt;
                  if (errorIdx >= 0) {
                    const start = Math.max(0, errorIdx - 5);
                    const end = Math.min(lines.length, errorIdx + 25);
                    excerpt = lines.slice(start, end).join('\n');
                  } else {
                    excerpt = lines.slice(-30).join('\n');
                  }
                  if (excerpt.length > 3000) excerpt = excerpt.slice(-3000);
                  body += '```\n' + excerpt + '\n```\n\n';
                  body += `[Full log](${fail.htmlUrl})\n`;
                } catch (e) {
                  body += `_Could not fetch log excerpt: ${e.message}_\n\n[Full log](${fail.htmlUrl})\n`;
                }
                body += '\n</details>\n\n';
              }
            }
            body += `\n[View full run](${runUrl})\n`;
            await upsertComment(body);

            async function upsertComment(body) {
              // Paginate so the marker comment is found even on very active
              // PRs with >100 comments; otherwise listComments would page
              // past the sticky and we'd post a fresh comment every run.
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner, repo, issue_number: prNumber, per_page: 100,
              });
              const existing = comments.find(c => c.body?.includes(marker));
              if (existing) {
                await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
              } else {
                await github.rest.issues.createComment({ owner, repo, issue_number: prNumber, body });
              }
            }
          # yamllint enable rule:line-length

  # ── Summary gate for branch protection ─────────────────────────────
  deployment-validation-complete:
    name: Deployment Validation
    runs-on: ubuntu-latest
    needs: [drift-check, detect, validate]
    if: always()
    steps:
      - name: Check validation results
        # yamllint disable rule:line-length
        run: |
          DRIFT="${{ needs.drift-check.result }}"
          DETECT="${{ needs.detect.result }}"
          VALIDATE="${{ needs.validate.result }}"
          echo "drift-check: $DRIFT / detect: $DETECT / validate: $VALIDATE"
          if [[ "$DRIFT" == "failure" || "$DETECT" == "failure" || "$VALIDATE" == "failure" ]]; then
            echo "❌ Deployment validation failed"
            exit 1
          fi
          if [[ "$VALIDATE" == "skipped" ]]; then
            echo "✓ No affected deploys — validation skipped"
            exit 0
          fi
          echo "✓ All deployment validations passed"
        # yamllint enable rule:line-length
