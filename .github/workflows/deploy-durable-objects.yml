---
name: Deploy Durable Objects

on:
  push:
    branches: [main]
    paths:
      - "services/durable-objects/**"
      - "libs/loom/**"
      # The whole engine, not a hand-picked list (#1733). This worker imports
      # @autumnsgrove/lattice, so any module reachable from src/index.ts can
      # break its bundle — and #1723 proved it: a config-barrel import added
      # `import.meta.env` at module load and the worker stopped deploying for
      # two hours. Then #1732 fixed it and did not redeploy, because the repair
      # touched paths the old list did not name. A subset is always wrong
      # eventually; redeploying too often is the cheaper mistake.
      - "libs/engine/**"
  workflow_dispatch:

permissions:
  contents: read
  deployments: write
  issues: write

jobs:
  deploy:
    uses: ./.github/workflows/_deploy-worker.yml
    with:
      worker-dir: services/durable-objects
      needs-engine: true
    secrets: inherit
