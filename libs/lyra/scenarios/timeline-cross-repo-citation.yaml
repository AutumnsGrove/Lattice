name: a citation of another repo's commit is refused
recipe: timeline-test
input:
  repos: [lattice, lyra]
  commits:
    - { repo: lattice, sha: abc123, message: Wire the adapter }
    - { repo: lyra, sha: def456, message: Check the arguments }
model:
  - tool_calls: [{ id: t1, name: start_project, args: { repo: lattice } }]
  - tool_calls:
      [
        {
          id: t2,
          name: add_line,
          args: { project: lattice, text: Checked the arguments, cites: [c2] },
        },
      ]
  - tool_calls:
      [{ id: t3, name: add_line, args: { project: lattice, text: Wired the adapter, cites: [c1] } }]
  - tool_calls: [{ id: t4, name: start_project, args: { repo: lyra } }]
  - tool_calls:
      [
        {
          id: t5,
          name: add_line,
          args: { project: lyra, text: Checked the arguments, cites: [c2] },
        },
      ]
  - tool_calls: [{ id: t6, name: finish, args: {} }]
expect_events:
  - { type: tool_end, call_id: t2, is_error: true }
  - { type: tool_end, call_id: t5, is_error: false }
  - { type: run_end, reason: done }
expect_record:
  - { type: tool_message, toolCallId: t2, isError: true }
  - { type: status, state: done }
