name: finish is refused until the day is covered, then accepted
recipe: timeline-test
input:
  repos: [lyra]
  commits:
    - { repo: lyra, sha: abc123, message: Add the validator }
model:
  - tool_calls: [{ id: t1, name: finish, args: {} }]
  - tool_calls: [{ id: t2, name: start_project, args: { repo: lyra } }]
  - tool_calls:
      [{ id: t3, name: add_line, args: { project: lyra, text: Added the validator, cites: [c1] } }]
  - tool_calls: [{ id: t4, name: finish, args: {} }]
expect_events:
  - { type: tool_end, call_id: t1, is_error: true }
  - { type: tool_end, call_id: t4, is_error: false }
  - { type: run_end, reason: done }
expect_record:
  - { type: tool_message, toolCallId: t1, isError: true }
  - { type: status, state: done }
