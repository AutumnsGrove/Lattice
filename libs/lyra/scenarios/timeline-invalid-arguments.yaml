name: an argument of the wrong type never reaches the tool
recipe: timeline-test
input:
  repos: [lyra]
  commits:
    - { repo: lyra, sha: abc123, message: Name the tool's schema }
model:
  - tool_calls: [{ id: t1, name: start_project, args: { repo: lyra } }]
  - tool_calls: [{ id: t2, name: add_line, args: { project: lyra, text: 7, cites: [c1] } }]
  - tool_calls:
      [{ id: t3, name: add_line, args: { project: lyra, text: Named the schema, cites: [c1] } }]
  - tool_calls: [{ id: t4, name: finish, args: {} }]
expect_events:
  - { type: tool_end, call_id: t2, is_error: true }
  - { type: tool_end, call_id: t3, is_error: false }
  - { type: run_end, reason: done }
expect_record:
  - { type: tool_message, toolCallId: t2, isError: true, details: { code: bad_request } }
  - { type: status, state: done }
